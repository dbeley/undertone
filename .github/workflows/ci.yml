name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: flake check
        run: nix flake check --print-build-logs
      - name: fmt
        run: nix develop -c cargo fmt --check
      - name: clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: test
        run: nix develop -c cargo test
      - name: perf budget
        # Release build: the timings in tests/perf.rs are meant to catch
        # regressions in optimised code, where the idle plan is a few µs.
        run: nix develop -c cargo test --release --test perf
      - name: build
        run: nix build .# --print-build-logs
      - name: degradation matrix
        # Real pty, real binary, real screen: art protocol per setting, narrow
        # and tiny layouts, dead server, missing helpers. Uses the fixture
        # server, so it needs no network.
        run: nix develop -c python3 scripts/degradation.py result/bin/undertone
      - name: binary size gate
        run: |
          size=$(stat -c%s result/bin/undertone)
          echo "binary size: $size bytes"
          limit=12582912
          if [ "$size" -gt "$limit" ]; then
            echo "::error::binary is $size bytes, exceeding the 12 MB budget"
            exit 1
          fi

  arm:
    # Every target this app is for is ARM and the `check` job only builds
    # x86_64. This cross-builds the binary for aarch64 (build scripts run
    # natively, so no emulation) in its own job, so it costs wall-clock time in
    # parallel rather than in series.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: cross-compile for aarch64
        run: nix build .#packages.x86_64-linux.cross-aarch64 --print-build-logs
      - name: it really is an ARM binary
        # e_machine at offset 18 of an ELF header: 0xb7 is AArch64.
        run: |
          od -An -tx1 -j18 -N2 result/bin/undertone
          od -An -tx1 -j18 -N2 result/bin/undertone | grep -q "b7 00"
