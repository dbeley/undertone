[package]
name = "undertone"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Subsonic/Navidrome client for very weak Linux hardware"
license = "GPL-3.0-or-later"
repository = "https://github.com/dbeley/undertone"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
libc = "0.2"
md-5 = "0.10"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
